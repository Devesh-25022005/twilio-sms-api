<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilio SMS Activity</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/postmonger@0.0.16/postmonger.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input[type="text"] {
            width: 400px;
            padding: 6px;
            margin-top: 6px;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <h2>Twilio SMS</h2>

    <label for="message">SMS Message (Twilio trial template name)</label>
    <input
        type="text"
        id="message"
        placeholder="e.g. sms_marketing_promotions"
    />
    <div class="hint">On Twilio trial accounts, this must match a pre-defined template name, not free text.</div>

    <label for="phone">Phone Number (E.164 format)</label>
    <input
        type="text"
        id="phone"
        placeholder="+91XXXXXXXXXX"
    />
    <div class="hint">Must be one of your Twilio-verified numbers while on a trial account.</div>

    <script src="customActivity.js"></script>

</body>
</html>
